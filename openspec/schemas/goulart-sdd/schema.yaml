name: goulart-sdd
version: 1
description: Default OpenSpec workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append `--store "<id>"` to
      both commands only for a registered standalone store, and keep `--type
      spec`: a change and a spec sharing a name is otherwise an ambiguous-item
      error. `openspec list` without `--specs` lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with `openspec show "<spec-id>" --type spec` (same `--store` rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: plan-review
    generates: plan-review.md
    description: Pre-implementation plan review and human approval gate
    template: plan-review.md
    instruction: |
      Review the plan (proposal.md, all change specs, and design.md) and produce plan-review.md.

      ## Reviewer mission

      The reviewer evaluates the plan adversarially, not as a summary.
      Read proposal.md, all applicable change specs, design.md, and any additional repository context needed to assess the plan.

      Read-only posture:
      - The reviewer SHALL NOT modify proposal.md, specs/, or design.md.
      - The reviewer's ONLY permitted write is plan-review.md.
      - If a problem is found, record a finding or Required Change.
      - Do NOT silently fix the reviewed artifacts.

      ## Independent review and fallback hierarchy

      Use this hierarchy in order:
      1. Harness-supplied separate/fresh context — preferred.
      2. User-managed separate clean session — fallback, still independent.
      3. Degraded review in the same/non-separate context — last resort only.

      Rules:
      - Independent review requires a context/session separate from the author/implementer.
      - Cross-model review is optional and NOT required for independence.
      - Using another model without separate context does NOT establish independence.
      - Degraded review is permitted ONLY when both fresh-context options are unavailable.
      - Degraded review MUST disclose its limitation in the artifact.
      - Degraded review MUST NOT be described as independent.
      - Human acknowledgement of the degraded limitation is required before a permitting disposition.
      - The reviewer MUST NOT fabricate human acknowledgement; leave it pending until it actually occurs.

      Record the review mode and reviewer context/session in the artifact.

      ## Reviewed-state evidence

      Record what was actually reviewed:
      - review mode (Independent or Degraded);
      - reviewer context/session description;
      - ROUND: 1 | 2;
      - previous round outcome (if Round 2);
      - proposal path/revision;
      - spec paths/revisions;
      - design path/revision;
      - additional reviewed paths where relevant.

      Where repository revision/commit information is available, record it.
      Filesystem timestamps are informational only and MUST NOT be used as proof of review freshness.

      ## Adversarial review posture

      Actively challenge the plan. Review at least these attack surfaces where applicable:

      Compliance:
      - proposal, specs, and design agree with each other;
      - required behavior from specs is supported by the design;
      - requirements/scenarios have not been omitted or contradicted;
      - the design does not introduce behavior that conflicts with approved specs.

      Quality:
      - ambiguity;
      - incomplete requirements/design reasoning;
      - assumptions hidden as facts;
      - untestable or unverifiable behavior;
      - missing decisions that would materially affect implementation.

      Feasibility:
      - technically implausible assumptions;
      - dependency or integration assumptions not accounted for;
      - implementation approach that cannot reasonably satisfy the specs;
      - unresolved questions that would materially change implementation.

      Scope:
      - scope creep;
      - missing in-scope behavior;
      - unnecessary architecture beyond the approved change;
      - mismatch between proposal scope and design.

      Risk:
      - architectural risk;
      - migration/compatibility risk;
      - reliability/security implications where applicable;
      - assumptions likely to create implementation or verification failure.

      Do not invent new product requirements because the reviewer prefers another design.
      Review against the approved proposal/spec/design contract.

      ## Findings taxonomy

      Every finding MUST contain exactly one severity and exactly one category:
      - Severity: Critical | Moderate | Suggestion
      - Category: compliance | quality | feasibility | scope | risk

      Use stable IDs: F-001, F-002, etc.
      Do not fabricate findings to populate the template.
      If there are no findings, record that the review is clean.

      Do not invent an automatic severity-to-verdict mapping.
      Verdict is based on the substantive state of the plan and the transition rules below.

      ## Verdict contract

      Emit exactly ONE verdict: APPROVE | APPROVE_WITH_CHANGES | REVISE

      ### APPROVE
      The reviewed plan is acceptable as-is.
      Human disposition: STATUS: ACCEPTED (reason optional).
      Downstream planning may proceed after the human disposition and all other gate conditions are satisfied.

      ### APPROVE_WITH_CHANGES
      Required Changes exist and MUST be applied before progression.
      Each Required Change must record:
      - requested change;
      - Applied: Yes | No;
      - Materiality: MATERIAL | NON_MATERIAL;
      - Materiality Rationale.

      ACCEPTED MUST NOT bypass unapplied Required Changes.

      ### REVISE
      Normal progression is blocked.
      Planning artifacts must normally be revised and reviewed again.
      Human override is possible only through explicit STATUS: OVERRIDDEN with mandatory reason.
      The reviewer MUST NOT fabricate the override or reason.

      ## Required Changes materiality

      MATERIAL: affects requirements, scope, architecture, acceptance criteria, or implementation assumptions.
      After MATERIAL Required Changes are applied, normal progression requires a new plan-review round.
      Exception: human may record STATUS: OVERRIDDEN with mandatory reason identifying the waived re-review condition.
      The override is an explicit exception; it does NOT make the previous review fresh.

      When an override is used, the review artifact MUST record in its Re-review / Override Evidence section:
      - each affected reviewed input path;
      - a concise description of the change to that input;
      - Re-review Waived: Yes;
      - the mandatory override/waiver reason identifying the re-review condition being waived.

      The prior review remains STALE for changed inputs.
      The override does NOT make it fresh.
      The override does NOT mean the changed plan was reviewed.

      NON_MATERIAL: editorial correction only, does NOT change requirements, scope, architecture, acceptance criteria, or implementation assumptions.
      If all Required Changes are applied and demonstrably NON_MATERIAL, the human MAY record STATUS: ACCEPTED without re-review.
      The review artifact MUST contain justification explaining why the changes are non-material.

      ## Complete verdict/disposition matrix

      Case A — APPROVE:
        Human STATUS: ACCEPTED (reason optional) → normal continuation permitted if current.

      Case B — APPROVE_WITH_CHANGES + unapplied changes:
        BLOCKED. STATUS: ACCEPTED MUST NOT permit progression.

      Case C — APPROVE_WITH_CHANGES + all changes NON_MATERIAL (applied):
        Human MAY record STATUS: ACCEPTED. Re-review MAY be skipped.
        Materiality rationale required in the artifact.

      Case D — APPROVE_WITH_CHANGES + MATERIAL change (applied):
        Prior review is stale for changed inputs.
        Normal progression: new plan-review round required.
        Alternative: explicit human STATUS: OVERRIDDEN with mandatory reason.
        Override evidence: affected inputs, change description, Re-review Waived: Yes, waived condition.

      Case E — REVISE:
        Normal progression BLOCKED. Artifacts normally revised and re-reviewed.

      Case F — REVISE + human override:
        Human MAY explicitly record STATUS: OVERRIDDEN with mandatory reason.
        This recorded exception MAY permit downstream planning, subject to all other Goulart gates.
        The reviewer MUST NOT fabricate the override or reason.

      Case G — human chooses revision:
        Human records STATUS: REVISE with reason. Artifacts revised and re-reviewed.

      Case H — degraded review:
        Degraded limitation disclosed; human acknowledgement actually recorded before permitting disposition.

      ## Human Decision ownership

      The reviewer does NOT choose the human decision.
      The reviewer produces: reviewed-state evidence, findings, verdict, Required Changes, materiality analysis, review history.
      The HUMAN owns: STATUS: ACCEPTED, STATUS: REVISE, STATUS: OVERRIDDEN.
      - Leave Human Decision unrecorded until the human actually chooses.
      - Never infer ACCEPTED from an APPROVE verdict.
      - Never fabricate an override, Human Reason, or degraded-mode acknowledgement.
      - Reviewer approval alone is NOT the human gate.

      ## Review freshness semantics

      A material change to any reviewed proposal, spec, or design makes the prior plan-review stale for the changed inputs.
      This includes material changes requested by the reviewer itself.
      Normal progression requires re-review unless an explicit human override is recorded.
      An override is NOT freshness; it does not mean the changed plan was reviewed.

      For NON_MATERIAL corrections, freshness may be preserved without re-review only when the rationale is explicitly recorded.

      ## Two-round persistence

      Record ROUND: 1 | 2 in the artifact.
      Round 1: first review.
      Round 2: follows Round 1 due to REVISE, MATERIAL APPROVE_WITH_CHANGES corrections, or another material change to reviewed inputs.
      Round 2 MUST preserve concise previous-round history in the same artifact.
      The artifact SHALL NOT overwrite with no historical evidence.

      ## Round limit and escalation

      Maximum 2 review/revision rounds for plan-review.
      This limit includes re-review triggered by REVISE, APPROVE_WITH_CHANGES, or material post-review changes.
      After Round 2, if there remains REVISE, unresolved Required Changes, or another material change requiring further review:
      - STOP and escalate to the human.
      - Record escalation required, escalation reason, concise unresolved issue summary.
      - Do NOT automatically start Round 3.
      - Do NOT reset ROUND to 1.
      - Do NOT erase previous history.

      ## Artifact-writing behavior

      Populate the approved plan-review template (plan-review.md).
      The instruction defines behavior and transition semantics; the template owns the artifact shape.
      Do not duplicate the entire template inside schema.yaml.
    requires:
      - proposal
      - specs
      - design

  - id: test-plan
    generates: test-plan.md
    description: Test plan defining validation approach for the change
    template: test-plan.md
    instruction: |
      Create test-plan.md as a behavioral coverage ledger that maps every specification scenario to explicit validation evidence.

      ## Test-plan mission

      1. Read every applicable spec file for the current change.
      2. Identify every `#### Scenario:` in every spec file.
      3. Create at least one validation entry for every scenario.
      4. Preserve Spec Path + Requirement + Scenario identity.
      5. Allow more than one validation entry for one scenario where useful.
      6. Calculate the coverage summary.
      7. Refuse to treat the plan as complete while any scenario is unmapped.

      Do not invent scenarios that do not exist in the specs.
      Do not silently omit scenarios because they appear difficult to test.

      ## Coverage gate

      Record:
      - Total Scenarios: actual count from all spec files
      - Mapped Scenarios: scenarios with at least one validation entry
      - Unmapped Scenarios: scenarios with zero validation entries

      Before downstream tasks may be created:
      - Unmapped Scenarios MUST equal 0.
      - If any scenario remains unmapped, record the gap.
      - Do not claim the test-plan is complete.
      - Downstream task generation is blocked until the gap is resolved.

      A placeholder or TODO entry does not count as a real mapping unless it contains an actual evaluable validation approach.

      ## Validation types

      Each validation entry MUST use exactly one of:
      - AUTOMATED
      - MECHANICAL
      - SEMANTIC

      Do not introduce MANUAL, REVIEW, HYBRID, OTHER, or any fourth type.

      ## AUTOMATED

      Use when the behavior can reasonably be verified by an automated test (unit, integration, E2E, or other executable behavioral test).

      For every AUTOMATED entry require:
      - test file/path;
      - test function/method/test name.

      If the test does not exist yet, the plan may identify the intended path/name.
      Do not falsely claim a test already exists or passes.
      The test-plan is planning/coverage evidence, not execution proof.

      ## MECHANICAL

      Use when the scenario can be validated deterministically by a tool or command (lint, typecheck, build, schema validation, static check, deterministic repository command).

      For every MECHANICAL entry require:
      - exact command or mechanical check sufficient to evaluate the scenario.

      The command must actually evaluate the mapped scenario or requirement.
      Do not use MECHANICAL merely because a command can be run.

      ## SEMANTIC

      Use only when automated or mechanical validation is not reasonably suitable.

      For every SEMANTIC entry require:
      - rationale explaining why automation/mechanical validation is unsuitable;
      - evaluator: who or what performs the evaluation;
      - evaluation description sufficient for later verification.

      Do not use SEMANTIC as an escape hatch for tests that are merely inconvenient to write.
      Do not fabricate a human evaluation that has not occurred.
      At planning time, describe the required future evaluation.

      ## Coverage ledger

      Populate the approved test-plan.md template fields.

      Primary ledger entry:
      - stable ID (TP-001, TP-002, etc.);
      - Spec Path;
      - Requirement;
      - Scenario;
      - Validation Type;
      - Test File/Command;
      - Test Name;
      - Status.

      For SEMANTIC entries also populate the Semantic Entry Detail section:
      - same ID;
      - Semantic Rationale;
      - Semantic Evaluator;
      - Evaluation Description.

      Use the same TP-* ID to connect the ledger row and semantic detail.

      ## Status semantics

      Status values: NOT_STARTED | RED | GREEN | REFACTOR | PASS | DEFERRED

      Rules:
      - Statuses are tracking/visibility evidence only.
      - Status reflects known current state only.
      - Status does NOT prove historical chronology.
      - RED followed later by GREEN is NOT proof that test-first TDD actually occurred.
      - The methodology MUST NOT claim chronological proof from test-plan status.
      - Do not require Git timestamps or filesystem timestamps as TDD proof.

      ## Planning-time truthfulness

      When initially generating test-plan.md:
      - do not mark an unimplemented automated test as PASS;
      - do not claim a command passed unless it was actually executed and observed;
      - do not claim semantic evaluation completed unless it actually occurred;
      - use an honest planning status such as NOT_STARTED where appropriate.

      Do not fabricate evidence.

      ## Behavioral coverage integrity

      Tests or validations SHALL NOT be removed, weakened, skipped, or replaced in a way that reduces required behavioral coverage without an explicitly justified specification change.

      When validations change:
      - required scenario behavior must remain covered;
      - renaming, moving, consolidating, or replacing a test is allowed if required behavioral coverage remains intact;
      - reduction in required coverage requires a corresponding explicit spec amendment.

      The rule is about retained behavior/scenario coverage, NOT file identity.

      Record coverage changes in the template's Coverage Integrity section:
      - Entry;
      - Change;
      - Coverage Impact;
      - Spec Amendment;
      - Rationale.

      A coverage reduction without a corresponding justified spec amendment is not permitted.
      For a newly generated test plan with no validation changes yet, do not invent coverage-change records.

      ## Duplicate scenario names

      If two scenarios share the same display name, do not collapse them.
      Identity is Spec Path + Requirement + Scenario.
      Each distinct scenario occurrence must be represented.

      ## Relationship to TDD

      This instruction is focused on test planning.
      It prepares AUTOMATED validations that may later participate in RED-GREEN-REFACTOR.
      This instruction does NOT implement the tasks-instruction TDD contract or apply execution logic.
      Do not add one-task-per-invocation execution logic, retry mechanics, implementation sequencing, or implementer context rules.

      ## Artifact-writing behavior

      Populate the approved test-plan template (test-plan.md).
      The instruction defines coverage and validation semantics; the template owns the artifact shape.
      Do not duplicate the entire template inside schema.yaml.
    requires:
      - specs
      - plan-review

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      ```

      Reference specs for what needs to be built, design for how to build it.
    requires:
      - test-plan
      - design
      - plan-review

  - id: code-review
    generates: code-review.md
    description: Post-implementation code review gate
    template: code-review.md
    instruction: |
      Review the completed implementation adversarially and produce/update code-review.md using the approved code-review template.

      ## Stage precondition and reviewer mission

      Code-review occurs after all implementation tasks are complete and before final verification.
      Before performing a normal review, inspect tasks.md and confirm all implementation tasks are complete.
      If any task is incomplete, STOP, report that code-review is premature and identify the incomplete tasks. Do NOT emit a permitting review verdict.
      Artifact dependency existence alone does not prove implementation completion.

      Read the applicable specs, design.md, tasks.md, test-plan.md, implementation/source changes, tests, relevant configuration, and other repository evidence needed to evaluate the change.
      Evaluate against the approved proposal/spec/design contract; consult proposal.md for scope where needed.
      During review, write findings and Required Changes to code-review.md rather than silently implementing source/test/config fixes.
      Do NOT rewrite specs to make the implementation appear compliant. Implementation fixes are separate work and can invalidate the review.

      ## Independent review and fallback hierarchy

      Use this hierarchy in order:
      1. Harness-supplied separate/fresh context — preferred.
      2. User-managed separate clean session — fallback, still independent.
      3. Degraded review in the same/non-separate context — last resort only.

      Independent review requires a context/session separate from the implementer context.
      Cross-model review is optional; a different model is not required, and a different model alone does NOT establish independence.
      If the harness cannot supply separate context but the user can open a clean separate session, hand off to that session for independent review.
      Degraded review is allowed ONLY when both fresh-context options are unavailable.
      Disclose the degraded limitation in the artifact and never call this review independent.
      Human acknowledgement of degraded mode is independently required before downstream progression, including for a clean review.
      Never fabricate acknowledgement; leave it pending until it actually occurs.

      ## Reviewed implementation evidence

      Populate the existing template fields for what was actually reviewed:
      - Review Mode: Independent | Degraded;
      - Reviewer Context/Session;
      - ROUND: 1 | 2 and Previous Round Outcome for Round 2;
      - Reviewed Revision and optional Base Revision;
      - Reviewed Paths, Test Paths, and Additional Evidence Paths where relevant.

      Use repository revision/diff and path evidence where available, with conservative semantic comparison when revision evidence cannot represent the reviewed working tree.
      Review Timestamp is informational only. Neither repository nor filesystem timestamps establish freshness; assess reviewed revisions/paths and the semantic impact of changes.

      ## Evaluation scope

      Assess every applicable area in Review Coverage:
      - Implementation vs specs;
      - Implementation vs design;
      - Scope compliance;
      - Test quality;
      - Behavioral coverage;
      - Code quality;
      - Maintainability;
      - Architecture;
      - Unnecessary complexity;
      - Potential regressions.

      For each area record Pass | Concern | Not Applicable and sufficient Evidence/Notes to explain the result.
      Do not use Not Applicable to avoid review work.
      Compare observable implementation behavior against approved spec scenarios. Record omitted, contradicted, weakened, or out-of-scope behavior as findings.
      Flag behavior or architecture beyond approved scope as scope creep. Do not invent product requirements merely because another approach is preferred.

      ## Findings and blocking state

      For each real finding use a stable F-* ID (F-001, F-002, etc.) and exactly one of each:
      - Severity: Critical | Moderate | Suggestion;
      - Category: compliance | quality | feasibility | scope | risk.

      Record Description, Evidence/Context, Affected Path/Component, Requires Implementation Change: Yes | No, and Blocking Condition: Yes | No.
      Requires Implementation Change and Blocking Condition are independent: a correction may be non-blocking. Never infer blocking solely from a required implementation change.
      Blocking Condition: Yes prevents normal progression until resolved or an explicitly permitted human override records the waived condition and reason.
      Any Critical finding MUST force VERDICT: REVISE, never APPROVE or APPROVE_WITH_CHANGES. An unresolved Critical condition remains blocking regardless of triage.
      Keep the Finding Summary consistent with the findings. Do not fabricate findings to fill placeholders; with zero findings, record a clean review.

      ## Per-finding human triage

      If findings exist, the HUMAN must triage each as exactly one of ACCEPT | REJECT | DEFER.
      Populate Per-Finding Human Triage and its summary only from actual human decisions; leave dispositions Pending until recorded. The reviewer MUST NOT fabricate triage or justification.
      - ACCEPT: justification optional. If an implementation change is required, it must be addressed before verify. ACCEPT alone does NOT resolve a blocking condition.
      - REJECT: justification REQUIRED. Rejection does NOT automatically waive blocking or Critical conditions.
      - DEFER: justification REQUIRED. Deferral does NOT automatically waive blocking or Critical conditions.

      REJECT or DEFER without justification is invalid/incomplete triage. All mandatory triage must be complete before normal progression.
      A justified REJECT/DEFER of a non-blocking finding may allow normal progression when no unresolved blocking/Critical condition or other gate remains.
      If blocking/Critical state remains, normal progression stays BLOCKED; unresolved Critical findings still force REVISE.
      REJECT/DEFER is NOT itself an override. Record the actual disposition and follow-up in the artifact without silently treating a rejected/deferred change as applied.

      ## Verdict transitions

      Emit exactly ONE active verdict: APPROVE | APPROVE_WITH_CHANGES | REVISE.

      APPROVE means no blocking implementation changes are required:
      - Clean review: zero findings SHALL yield APPROVE. No triage or additional unconditional human approval is required; the verdict stands as-is.
      - Non-blocking findings, including Moderate or Suggestion findings, may coexist with APPROVE, but each requires human triage.
      - After required triage, verification may proceed only if no unresolved blocking condition or unapplied accepted/required change remains, no material implementation change invalidates the review, and later verification prerequisites are met.
      - Do NOT introduce a generic ACCEPTED gate or human approval field like plan-review. Degraded-mode acknowledgement remains separately required.

      APPROVE_WITH_CHANGES means at least one implementation change is required before verification, subject to explicit human triage:
      - Connect each required fix to findings in Required Changes using stable RC-* IDs.
      - Record Related Finding(s), Requested Implementation Change, Applied: Yes | No, Affected Paths/Revision, Materiality: MATERIAL | NON_MATERIAL, and Materiality Rationale.
      - All findings must be triaged. Unapplied accepted/required changes block normal progression.
      - Justified REJECT/DEFER follows the triage rules above; it permits progression only when no unresolved blocking/Critical condition or other required action remains.
      - Applied MATERIAL corrections make the prior review stale and require a new round normally. Demonstrably NON_MATERIAL corrections may avoid re-review only with recorded justification.

      REVISE blocks normal progression to verify:
      - Use when implementation must be revised and reviewed again, any Critical finding exists, or substantive blocking state requires another review.
      - Normal path: revise implementation, then perform a new code-review round within the two-round limit.
      - A human MAY explicitly waive a review condition through the Explicit Human Override section with mandatory reason. This is an exception subject to other gates, not a replacement verdict or a claim of freshness.

      ## Materiality and re-review evidence

      A post-review change is MATERIAL when it changes the substance of the reviewed implementation: implementation/external behavior, architecture, materially relevant tests or coverage, or behavior-changing configuration.
      This includes MATERIAL fixes for ACCEPTED findings and changes requested by the reviewer itself.
      Such changes make the prior code-review STALE for the changed implementation. Normal progression requires another code-review round; the old review does not cover the changed implementation.

      For implementation changes after review, populate Review Staleness / Re-review Evidence:
      - Implementation Changes After Review: Yes;
      - Changed Paths: each path, change description, and resulting revision where available;
      - Staleness Classification: MATERIAL | NON_MATERIAL;
      - Materiality Rationale;
      - Re-review Required: Yes | No;
      - Re-review Justification.

      MATERIAL requires Re-review Required: Yes for normal progression. A permitted waiver is recorded separately, without changing the stale state or hiding the normal re-review requirement.
      NON_MATERIAL may use Re-review Required: No ONLY with explicit Materiality Rationale and Re-review Justification explaining why the correction does not materially change the reviewed implementation.
      Record changed paths/revision even for NON_MATERIAL corrections. Unsupported labels such as minor, small, or editorial are not sufficient reasoning.
      An unchanged implementation does not become stale merely with time; record Implementation Changes After Review: No when supported by the evidence.

      ## Explicit Human Override

      Use this existing section only when the human actually chooses a permitted review exception. Record:
      - Override Invoked: Yes;
      - Waived Condition: the exact review condition being waived;
      - Override Reason: mandatory human reason;
      - Affected Review State / Inputs: the affected review state and implementation inputs.

      The reviewer MUST NOT fabricate the override or reason, or infer an override from REJECT/DEFER.
      An override does NOT make a stale review fresh, imply the changed implementation was reviewed, or establish independent review.
      It MUST NOT substitute for implementation task completion, required finding triage, or evaluable test-plan entries. These prerequisites remain independent.
      Record only the explicitly permitted exception; later verification still owns its prerequisite audit and final result.

      ## Two-round persistence and escalation

      Maximum 2 code-review/revision rounds. Use ROUND: 1 | 2.
      Round 1 is the initial review. Round 2 follows Round 1 for REVISE, MATERIAL APPROVE_WITH_CHANGES corrections, or another material implementation change requiring review.
      In Round 2, retain concise Previous Round Outcome in the SAME artifact: prior verdict, findings summary, actual human triage dispositions, and why Round 2 occurred.
      Preserve history rather than overwriting it without evidence of the previous round.

      The limit includes all required re-reviews, including APPROVE_WITH_CHANGES material corrections and other material implementation changes.
      After Round 2, unresolved blocking conditions, unresolved required changes, or another material change requiring further review MUST cause STOP and human escalation.
      Populate Escalation Evidence: Escalation Required: Yes, Escalation Reason, and Unresolved Conditions with a concise summary referencing findings/changes.
      Do NOT automatically start Round 3, reset ROUND to 1, erase previous-round history, or invent a human resolution after escalation.
      If Round 2 resolves all blocking/required state and no material new changes invalidate it, normal progression may continue under the verdict/triage rules and later verification gates.

      Populate the approved template's relevant fields; the template owns the artifact shape. Code-review records review readiness for verification, not the final whole-change verification result or adapter execution logic.
    requires:
      - tasks

  - id: verify
    generates: verify.md
    description: Final verification gate before archive
    template: verify.md
    instruction: |
      Create the verify artifact. This is a placeholder for the full verify instruction (Task 3.4).
    requires:
      - code-review

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
