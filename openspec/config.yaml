schema: goulart-sdd

context: |
  Goulart SDD is an opinionated Spec-Driven Development methodology on top of
  OpenSpec. It uses a strict-only profile, goulart-* namespace for all custom
  adapters, and OpenCode as the first adapter.

  Workflow: goulart-plan → independent review → goulart-apply (TDD) →
  goulart-verify → goulart-archive.

  Roles: Author (plan), Reviewer (review), Implementer (apply), Verifier (verify).

  The custom schema goulart-sdd adds plan-review, test-plan, code-review, and
  verify artifacts to OpenSpec's spec-driven schema. All upstream OpenSpec
  commands and skills are read-only; Goulart never modifies them.

rules:
  specs:
    - Use SHALL or MUST for all normative requirements
    - Every #### Scenario must be testable by AUTOMATED, MECHANICAL, or SEMANTIC validation
    - Do not add requirements without corresponding scenarios
  tasks:
    - Order tasks for TDD: test first, then implementation
    - Keep tasks small and focused (one logical change per task)
    - Each task must be independently testable
    - Do not batch unrelated changes into a single task
